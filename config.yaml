# Fanvue automation — current phase. Agents refuse work past phase+1.
# Current reality: ~1 subscriber. First milestone: 10 subscribers.

phase: 0
revenue_target: 5
subscriber_target: 10
focus:
  - fix_auth
  - upload_content
  - schedule_posts

oauth:
  scopes:
    - read:self
    - read:chat
    - write:chat
    - read:post
    - write:post
    - read:media
    - write:media
    - read:creator
    - write:creator
  redirect_uris:
    - http://localhost:3456/callback
    - http://localhost:3000/api/oauth/callback

content:
  bank_dir: content_bank
  max_uploads_per_run: 20
  max_teasers_per_run: 5
  teaser_audience: followers-and-subscribers
  teaser_captions:
    - New photos just dropped.
    - Behind the scenes from today's shoot.
    - A little teaser for later.
    - Fresh set is live for subscribers.
    - Saving the rest for the vault.

chat:
  enabled: false
  max_replies_per_run: 10
  reply_template: >-
    Hey {name} — thanks for writing. I saw your message and I will reply
    properly soon. If you are not subscribed yet, that is the best way to
    get the full sets.

money:
  enabled: false
  subscription_price_cents: 999
  min_subscribers_for_ppv: 5
  welcome:
    new_follower: Thanks for following. Subscribe if you want the full sets.
    new_subscriber: Welcome in. Glad you are here — ask me what you want next.
    first_message_reply: Hey, thanks for the message. What brought you here?

traffic:
  enabled: false

analytics:
  enabled: true
